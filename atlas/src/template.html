<title>Atlas Vial Provincial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout concept: a map-first stage. The map sits on a tinted "sea" field and two translucent panels float over it
   (controls left, ranking right). Comparison and plot follow as soft panels. Pills, curves, big display type. */
:root{
  --bg:#f6f3ee; --surface:#ffffff; --glass:rgba(255,255,255,.74); --ink:#101a22; --ink2:#44525d; --ink3:#7b8791; --line:#e3e6e7; --soft:#eef1f1;
  --sea1:#cfe4ec; --sea2:#e6eef0; --sea3:#f3ece1; --land-line:#ffffff;
  --pill:#1d4f8f; --pillink:#ffffff; --acc:#12355c;
  --t1:#e6f0fb; --t2:#fcf0d8; --t3:#def2ed; --t4:#eee7fa; --t5:#fbe6e5; --t6:#e7f1dc; --k1:#2a78d6; --k2:#e69a00; --k3:#0e9a84; --k4:#8548d6; --k5:#e34948; --k6:#5f9a2c; --shadow:0 18px 40px -18px rgba(16,26,34,.28),0 2px 6px rgba(16,26,34,.06);
  --dlo:#2a78d6; --dmid:#f1f1ee; --dhi:#e34948; --edge:#a2a6ae; --hot:#15181d;
  --s1:#e69a00; --s2:#0e9a84; --s3:#8548d6;
  --font-display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1117; --surface:#141d25; --glass:rgba(17,26,34,.74); --ink:#eef2f3; --ink2:#b3bec5; --ink3:#83909a; --line:#2a3640; --soft:#1b2630;
  --sea1:#12303d; --sea2:#0f1d27; --sea3:#1a1c1b; --land-line:#0e161d;
  --pill:#5b9bef; --pillink:#0b1117; --acc:#b9d6fb; --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  --t1:#13283d; --t2:#2b2315; --t3:#112b28; --t4:#231b35; --t5:#321c1d; --t6:#1a2a16; --k6:#93cf5c; --k1:#5b9bef; --k2:#f3b73a; --k3:#34c4ad; --k4:#a97df0; --k5:#f07372;
  --dlo:#5b9bef; --dmid:#30343b; --dhi:#f07372; --edge:#5a616c; --hot:#ffffff;
  --s1:#f3b73a; --s2:#34c4ad; --s3:#a97df0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1117; --surface:#141d25; --glass:rgba(17,26,34,.74); --ink:#eef2f3; --ink2:#b3bec5; --ink3:#83909a; --line:#2a3640; --soft:#1b2630;
  --sea1:#12303d; --sea2:#0f1d27; --sea3:#1a1c1b; --land-line:#0e161d;
  --pill:#5b9bef; --pillink:#0b1117; --acc:#b9d6fb; --shadow:0 18px 40px -18px rgba(0,0,0,.7);
  --t1:#13283d; --t2:#2b2315; --t3:#112b28; --t4:#231b35; --t5:#321c1d; --t6:#1a2a16; --k6:#93cf5c; --k1:#5b9bef; --k2:#f3b73a; --k3:#34c4ad; --k4:#a97df0; --k5:#f07372;
  --dlo:#5b9bef; --dmid:#30343b; --dhi:#f07372; --edge:#5a616c; --hot:#ffffff;
  --s1:#f3b73a; --s2:#34c4ad; --s3:#a97df0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0}
h1,h2,h3{margin:0;font-weight:inherit}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,.prov:focus-visible,.row:focus-visible,.pt:focus-visible{outline:2px solid var(--s3);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1560px;margin:0 auto;padding-block:22px 44px}

/* masthead */
.mast{display:flex;align-items:flex-end;gap:10px 28px;flex-wrap:wrap;margin-bottom:18px}
.mast h1{color:var(--acc);font-family:var(--font-display);font-weight:700;font-size:clamp(30px,4.4vw,52px);line-height:1;letter-spacing:-.025em;font-variation-settings:"opsz" 96}
.mast .tag{font-size:13.5px;color:var(--ink2);flex:1 1 240px;min-width:0;padding-bottom:5px}
.lang{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px;align-self:flex-start}
.lang button{border:0;background:transparent;color:var(--ink2);font-weight:600;font-size:12.5px;letter-spacing:.04em;padding:5px 13px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--pill);color:var(--pillink)}

/* stage */
.stage{position:relative;border-radius:34px;overflow:hidden;
  background:radial-gradient(900px 520px at 78% 8%,var(--sea1),transparent 70%),radial-gradient(700px 460px at 12% 96%,var(--sea3),transparent 70%),linear-gradient(165deg,var(--sea2),var(--sea2));
  display:grid;grid-template-columns:300px minmax(0,1fr) 392px;gap:0;padding:16px}
.stage>.mapbox{grid-column:1/-1;grid-row:1;padding:0 calc(392px + 10px) 0 calc(300px + 10px);display:flex;align-items:flex-start;justify-content:center;min-width:0}
.panel{position:relative;z-index:2;background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);border-radius:26px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.5);min-width:0}
:root[data-theme="dark"] .panel{border-color:rgba(255,255,255,.07)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel{border-color:rgba(255,255,255,.07)}}
.pl{grid-column:1;grid-row:1;align-self:start;padding:20px 18px 18px}
.pr{grid-column:3;grid-row:1;align-self:start;padding:18px 16px 10px}
.pt2{font-family:var(--font-display);font-weight:650;font-size:17px;letter-spacing:-.01em;margin:0 0 4px}
.cap{font-size:12px;color:var(--ink3)}
.lede{margin:0 0 16px;color:var(--ink2);font-size:14px;line-height:1.5}
.lbl2{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 8px;line-height:1.45}

/* pills */
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:4px;gap:2px;margin-bottom:18px}
.tabs button{border:0;background:transparent;color:var(--ink2);font-weight:600;font-size:13.5px;padding:8px 6px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.tabs button[aria-pressed="true"]{background:var(--pill);color:var(--pillink)}
.layers{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.layers button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.layers button:hover{border-color:var(--ink3)}
.layers button[aria-checked="true"]{background:var(--pill);color:var(--pillink);border-color:var(--pill)}
.layers .mk{display:none}.layers b{font-weight:inherit}
.pop{position:absolute;z-index:4;width:326px;max-width:calc(100% - 16px);background:var(--surface);color:var(--ink2);border:1px solid var(--line);border-radius:18px;box-shadow:0 22px 50px -14px rgba(16,26,34,.45),0 2px 8px rgba(16,26,34,.12);padding:14px 16px 14px;font-size:13px;line-height:1.5;animation:popin .18s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.pop{animation:none}}
.pop[hidden]{display:none}
.pop b{color:var(--ink);font-weight:600}
.pop .pclose{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;border:0;background:var(--soft);color:var(--ink);cursor:pointer;font-size:13px;line-height:1}
.pop .pclose:hover{background:var(--line)}
.pop .ph{display:flex;align-items:center;gap:8px;padding-right:32px;margin-bottom:6px;font-family:var(--font-display);font-size:17px;font-weight:650;color:var(--ink);letter-spacing:-.01em;line-height:1.2}
.pop .ph small{font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--ink3)}
.pop .pr2{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.pop .pr2 span:first-child{color:var(--ink2)}.pop .pr2 span:last-child{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.pop .pr2 small{display:block;color:var(--ink3);font-size:11.5px}
.pop.sheet{position:fixed;left:8px!important;right:8px;bottom:8px;top:auto!important;width:auto;max-width:none;max-height:55vh;z-index:20}
.pop .near .lk a{display:inline-block;margin-right:12px;padding:1px 0;font-size:12px}
.pop .near{margin-top:6px;padding-top:6px}
.pop{max-height:min(560px,calc(100vh - 32px));overflow:auto}
.pop .pr2 span:last-child{white-space:nowrap}
.pop .pn{margin-top:6px;font-size:12px;color:var(--ink3)}
.pop .near:first-of-type{margin-top:6px}
@media (min-width:861px){.pl.hascell{display:flex;flex-direction:column}.pl.hascell .lede,.pl.hascell .layerdesc{display:none}.pl.hascell .cellinfo.full{order:-1;margin:0 0 16px}}
.cellinfo.full{position:relative;padding:14px 14px 12px;color:var(--ink2)}
.cellinfo.full b{color:var(--ink);font-weight:600}
.cellinfo.full .pclose{position:absolute;top:9px;right:9px;width:28px;height:28px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);cursor:pointer;font-size:13px;line-height:1}
.cellinfo.full .ph{display:flex;align-items:center;gap:8px;padding-right:32px;margin-bottom:6px;font-family:var(--font-display);font-size:17px;font-weight:650;color:var(--ink);letter-spacing:-.01em;line-height:1.2;flex-wrap:wrap}
.cellinfo.full .ph small{font-family:var(--font-body);font-size:12px;font-weight:400;color:var(--ink3)}
.cellinfo.full .pr2{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px solid var(--line)}
.cellinfo.full .pr2 span:first-child{color:var(--ink2)}
.cellinfo.full .pr2 span:last-child{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cellinfo.full .pr2 small{display:block;color:var(--ink3);font-size:11.5px}
.cellinfo.full .pn{margin-top:6px;font-size:12px;color:var(--ink3)}
.cellinfo.full .near .lk a{display:inline-block;margin-right:12px;padding:1px 0;font-size:12px}
.pop.mini{width:auto;max-width:220px;padding:7px 28px 7px 11px;border-radius:12px;font-size:12.5px;line-height:1.35}
.pop.mini .pclose{top:4px;right:4px;width:22px;height:22px;font-size:11px}
.pop.mini .mn{display:block;color:var(--ink);font-weight:600}
.pop.mini .mv{display:block;color:var(--ink2);font-variant-numeric:tabular-nums}
.layerdesc{font-size:13px;color:var(--ink2);margin:0 0 14px;line-height:1.5}
.ramp{height:12px;border-radius:999px}
.ticks{position:relative;height:18px;font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%);top:4px;white-space:nowrap}
.legnote{font-size:12px;color:var(--ink3);margin:2px 0 12px;line-height:1.45}
.check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.check input{accent-color:var(--s3);width:16px;height:16px;margin:0}
.cellinfo{font-size:13px;color:var(--ink2);background:var(--soft);border-radius:16px;padding:11px 13px;margin:12px 0 0;line-height:1.5}
.cellinfo b{color:var(--ink);font-weight:600}
.near{margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
.near .nh{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:2px}
.near .nm1{display:block;color:var(--ink)}
.near .lk a{display:block;color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink3);text-underline-offset:3px;padding:2px 0}
.near .lk a:hover{text-decoration-color:var(--ink)}
.near .nm1 small{color:var(--ink3);font-size:12px}

/* map */
svg{display:block;max-width:100%}
#map{width:100%;height:auto;max-height:820px}
.sb{stroke:var(--ink2);stroke-width:1.6px;fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.sbt{font-size:15px;fill:var(--ink2);font-family:var(--font-body)}
.prov{stroke:var(--land-line);stroke-width:.9px;stroke-linejoin:round;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .3s}
.ol{fill:none;vector-effect:non-scaling-stroke;pointer-events:none;stroke-linejoin:round;stroke-linecap:round}
.ol.sig{stroke:var(--ink);stroke-width:1.4px}
.ol.halo{stroke:var(--land-line);stroke-width:7px;opacity:.95}
.ol.sel{stroke-width:3.6px}
.ol.hov{stroke:var(--ink);stroke-width:2.2px}
.ol.hot{stroke:var(--ink);stroke-width:1.3px}
.frame{fill:none;stroke:var(--ink3);stroke-opacity:.5;stroke-dasharray:2 6;stroke-linecap:round;stroke-width:1.4px;vector-effect:non-scaling-stroke}
.flabel{font-size:19px;fill:var(--ink3);font-family:var(--font-body);font-weight:500}
.hotc{fill:var(--hot);fill-opacity:.82;stroke:var(--land-line);stroke-width:.5px;vector-effect:non-scaling-stroke;pointer-events:none}
.cell{stroke:none;shape-rendering:crispEdges;cursor:pointer;transition:opacity .35s}
.cell.dim{opacity:.1}
.bord{fill:none;stroke:var(--ink3);stroke-width:.7px;vector-effect:non-scaling-stroke;pointer-events:none;opacity:.6}
.cellview .prov{fill:var(--surface)!important;pointer-events:none;stroke:none}

/* ranking */
.rank svg{width:100%;height:auto;max-width:440px;margin:0 auto}
.rank .lbl{font-size:11px;fill:var(--ink2);font-family:var(--font-body)}
.rank .row .hit{fill:transparent}
.rank .row.hov .hit{fill:var(--soft)}
.rank .row{cursor:pointer}
.rank .row.sel .lbl{fill:var(--ink);font-weight:600}
.rank .grid-l{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.rank .refl{stroke:var(--ink);stroke-width:1.3;vector-effect:non-scaling-stroke}
.rank .wh{stroke:var(--ink3);stroke-width:1.4;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.8}
.rank .ax{font-size:10.5px;fill:var(--ink2);font-variant-numeric:tabular-nums;font-family:var(--font-body)}
.rank .tipc{fill:var(--ink3)}
.tablewrap{overflow-x:auto}
#celltop{max-height:clamp(360px,60vh,620px);overflow-y:auto;overscroll-behavior:contain}
#celltop .top th{background:var(--surface);z-index:1}
table.top{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:12.5px}
.top{width:100%;font-size:13px}
.top th,.top td{padding:5px 2px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.top th{font-weight:600;color:var(--ink3);font-size:10.5px;position:sticky;top:0;white-space:normal;line-height:1.2;vertical-align:bottom}
.top td:nth-child(2),.top th:nth-child(2){text-align:left}
.top td small{display:block;color:var(--ink3);font-size:11px;max-width:78px;overflow:hidden;text-overflow:ellipsis}
.top td:first-child,.top th:first-child{text-align:left;color:var(--ink3);padding-left:0}
.top tr[data-i]{cursor:pointer}.top tr[data-i]:hover{background:var(--soft)}.top tr.sel{background:var(--soft);font-weight:600}
i.up,i.dn{font-style:normal;font-size:9px;margin-right:4px;vertical-align:1px}
i.up{color:var(--dhi)} i.dn{color:var(--dlo)}

/* lower panels */
.lower{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.card{background:var(--t,var(--surface));border-radius:30px;padding:24px 26px 26px;min-width:0;box-shadow:0 1px 0 var(--line)}
.c1{--t:var(--t1);--k:var(--k1)}.c2{--t:var(--t2);--k:var(--k2)}.c3{--t:var(--t3);--k:var(--k3)}.c4{--t:var(--t4);--k:var(--k4)}.c5{--t:var(--t5);--k:var(--k5)}.c6{--t:var(--t6);--k:var(--k6)}
.card h2::before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--k);margin-right:11px;vertical-align:2px}
.wide{grid-column:1/-1}
.scat{position:relative}.scat h2{padding-right:46px}
.zbtn{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);cursor:pointer;font-size:17px;line-height:1;opacity:.8;display:grid;place-items:center}
.zbtn:hover{opacity:1}
.zbtn::before{content:"⤢"}.zoom .zbtn::before{content:"✕"}
#zbd{position:fixed;inset:0;z-index:24;background:rgba(8,14,20,.55)}
#zbd[hidden]{display:none}
body.zooming{overflow:hidden}
.card.zoom{position:fixed;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1120px,94vw);max-height:94vh;overflow:auto;padding:26px 30px 28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.card.zoom svg{max-height:66vh;margin:0 auto}
.card.zoom .sub{font-size:14.5px;max-width:90ch}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.col .card{padding:22px 24px 24px}.col .card h2{font-size:21px}
.card h2{font-family:var(--font-display);font-weight:650;font-size:24px;letter-spacing:-.02em;margin:0 0 14px;line-height:1.1}
.top td b{font-weight:700}
#rank .pl{fill:var(--ink3);font-size:9px;font-variant-numeric:tabular-nums}
#rank .vl{fill:var(--ink2);font-size:9.5px;font-variant-numeric:tabular-nums}
.btn[aria-pressed="true"]{background:var(--pill);color:var(--pillink)}
.toolbar[hidden]{display:none}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar label{font-size:13px;color:var(--ink2)}
select{font:inherit;font-size:13.5px;background:var(--soft);color:var(--ink);border:0;border-radius:999px;padding:7px 14px;max-width:100%}
.btn{font:inherit;font-size:13px;border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:7px 15px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--line)}
.empty{color:var(--ink2);font-size:13px;margin:0 0 12px}
table.cmp{border-collapse:separate;border-spacing:0;width:100%;min-width:520px;font-variant-numeric:tabular-nums}
.cmp th,.cmp td{padding:8px 10px;text-align:right;vertical-align:top;border-bottom:1px solid var(--line)}
.cmp th:first-child,.cmp td:first-child{text-align:left;padding-left:0;color:var(--ink2);font-weight:400;width:29%;min-width:160px}
.cmp td{white-space:nowrap}.cmp td:first-child{white-space:normal}.cmp th.spain,.cmp td.spain{width:13%}
.cmp thead th{font-weight:600;color:var(--ink);vertical-align:bottom;border-bottom:0}
.cmp tr.sect td{padding-top:24px;font-family:var(--font-display);font-size:15px;color:var(--acc);border-bottom:0;font-weight:650}
.cmp td small{display:block;color:var(--ink3);font-size:12px;white-space:normal;max-width:170px;margin-left:auto}
.cmp td.spain,.cmp th.spain{color:var(--ink3)}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--soft);border-radius:999px;padding:4px 6px 4px 11px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.rm{border:0;background:transparent;color:var(--ink3);cursor:pointer;padding:0 3px;font-size:15px;line-height:1}
td b.z3{color:var(--ink)}
.scat svg{width:100%;height:auto}
.scat .gl{stroke:var(--ink3);stroke-opacity:.22;vector-effect:non-scaling-stroke}
.scat .rl{stroke:var(--ink3);stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.scat .ci{stroke:var(--ink3);stroke-width:1;opacity:.3;vector-effect:non-scaling-stroke}
.scat .pt{fill:var(--dlo);fill-opacity:.8;stroke:var(--surface);stroke-width:1.3;vector-effect:non-scaling-stroke;cursor:pointer}
.scat .pt.hov{stroke:var(--ink);stroke-width:2px}
.scat text{font-family:var(--font-body)}
.scat .tk{font-size:10.5px;fill:var(--ink2);font-variant-numeric:tabular-nums}
.scat .ql{font-size:10.5px;fill:var(--ink3)}
.scat .nm{font-size:11px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.scat .band{fill:var(--k);fill-opacity:.11;stroke:none}
.scat .lim{fill:none;stroke:var(--k);stroke-width:1.3;vector-effect:non-scaling-stroke}
.scat .lim2{stroke-dasharray:3 4;opacity:.8}
.scat .bar{cursor:pointer}
.scat .bt{font-size:10.5px;fill:var(--ink2);font-variant-numeric:tabular-nums}
.scat .bv{font-size:10.5px;fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.scat .gn{font-size:11.5px;fill:var(--ink);font-weight:600}
.scat .axl{font-size:11.5px;fill:var(--ink2)}
details.how{margin-top:20px;background:var(--t2);border-radius:26px;padding:6px 26px}
summary{cursor:pointer;list-style:none;font-family:var(--font-display);font-weight:650;font-size:19px;letter-spacing:-.01em;padding:16px 0;display:flex;align-items:center;gap:12px}

details ul{margin:0;padding:0 0 14px 22px;color:var(--ink2);max-width:100ch}
details li{margin-bottom:8px}
footer{margin-top:20px;color:var(--ink3);font-size:12.5px;max-width:110ch}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--ink);border-radius:14px;font-size:12.5px;line-height:1.45;padding:9px 12px;max-width:270px;display:none;box-shadow:0 14px 34px -10px rgba(16,26,34,.4),0 0 0 1px var(--line)}

}

  'Qué se cuenta: un accidente es un registro de la DGT con al menos una persona muerta o herida («accidente con víctimas»); es «mortal» si al menos una persona murió a 30 días; las muertes son las ocurridas a 30 días. La población es la residente a 1 de enero.',
  'El color compara cada provincia con España: rojo significa más que la media, azul menos y gris algo parecido. Un contorno oscuro indica que la diferencia es clara y no parece cosa del azar.',
  'Las provincias pequeñas tienen pocos accidentes, así que sus cifras bailan de un año a otro. Por eso cada punto del ranking lleva una línea: cuanto más larga, menos seguro es el valor. Si las líneas de dos provincias se solapan, no podemos decir cuál es mayor.',
  'El riesgo se mide por habitante, no por kilómetro recorrido. Una provincia con mucho turismo o tráfico de paso para su población puede parecer más peligrosa de lo que es para quienes viven allí.',
  'Las medidas «ajustadas» son estimaciones que tienen en cuenta también a las provincias vecinas y la media nacional. Así se evita que una provincia con pocos datos salga la mejor o la peor solo por casualidad. La proporción de mortales se corrige del mismo modo; la vista «observada» la muestra sin corregir.',
  'Muchos accidentes y accidentes graves son cosas distintas. El riesgo de morir por habitante depende de cuántos accidentes hay, de qué proporción acaba en muerte y de cuántas personas mueren en cada accidente mortal. Una provincia puede ser arriesgada porque tiene muchos accidentes, porque son graves, o por ambas cosas.',
  'Las zonas de 10 × 10 km (celdas) cubren la península y las islas Baleares, con Ceuta. Una celda es «caliente» cuando ella y las ocho que la rodean tienen más accidentes mortales de los que explicaría el azar: es una zona, no un punto suelto. Cada celda se asigna a la provincia que contiene su medio. Canarias y Melilla no tienen celdas, y Ceuta tiene dos.',
  'Cómo se calcula la cifra de una celda: los accidentes mortales de 2022 a 2025 se dividen entre los kilómetros de carretera de la celda y entre los cuatro años. Si la celda tiene muy poca carretera, el resultado se acerca a la media nacional, porque un par de accidentes darían, por casualidad, una cifra muy alta. Por ejemplo, una celda con 5 km de carretera y 3 accidentes mortales mostraría 15 por 100 km observados, pero su estimación es 2,2; cuanta más carretera tiene una celda, menos se mueve. Usa «observado» para ver la cifra sin corregir.',
  'Las celdas usan accidentes fuera de poblado cuya posición se ha podido situar con los puntos kilométricos de la carretera (entre el 86 % y el 87 % de esos accidentes cada año). Las posiciones son aproximadas y no se incluyen los accidentes dentro de poblado. Una celda en blanco tiene menos de 5 km de carretera en la capa de puntos kilométricos; una celda con carretera y sin ningún accidente situado se analiza, con cero accidentes. Las cifras son por kilómetro de carretera, no por kilómetro recorrido: una carretera muy transitada acumula más accidentes aunque cada vehículo corra menos riesgo.',
  'Los municipios cercanos salen de una base abierta construida con datos del INE y del CNIG, con la población residente a 1 de enero de 2021. Las distancias van del medio de la celda al centro del municipio, que en un municipio grande puede quedar lejos del pueblo. La cifra de 20 km suma municipios enteros. Tómalas como una guía del entorno, no como un recuento de la gente que vive junto a la carretera.',
  'Para ver dónde es más alto o más bajo, usa el botón sobre la lista: «De mayor a menor» / «De menor a mayor». En las provincias, el número antes de cada nombre es su puesto desde el valor más alto, sea cual sea el orden mostrado. Dos medidas cuentan accidentes por habitante (provincias) y dos cuentan accidentes por kilómetro de carretera (zonas): una es estimada y la otra es observada. Accidentes por kilómetro no es lo mismo que riesgo por kilómetro recorrido, porque no se conoce el tráfico de cada vía.',

  svg.onmouseover=e=>{const q=e.target.closest('[data-c]'); setHover(q?+q.dataset.c:null,e)};

  svg.onmouseleave=()=>setHover(null);
}
let _rw=window.innerWidth; window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-_rw)>40){_rw=window.innerWidth;renderHot();}});


/* ---------------- ranking intervals ---------------- */
function renderRI(){
  const svg=$('ri'), t=T(), n=P.length;
  const top=[...P].sort((a,b)=>a.R.rk-b.R.rk).slice(0,12).map(p=>p.c);
  const ids=[...top]; S.sel.forEach(c=>{if(ids.indexOf(c)<0)ids.push(c);});
  const list=ids.map(c=>byC[c]).sort((a,b)=>a.R.rk-b.R.rk);
  const W=520, l=122, r=100, rh=19, ax=22, H=ax+list.length*rh+10;
  const X=v=>l+(v-1)/(n-1)*(W-l-r);
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.innerHTML='';
  svg.appendChild(el('rect',{x:X(1)-4,y:ax-6,width:X(10)-X(1)+8,height:list.length*rh+8,rx:6,fill:'var(--k)',opacity:.10}));
  [1,10,20,30,40,52].forEach(v=>{svg.appendChild(el('line',{class:'gl',x1:X(v),x2:X(v),y1:ax-6,y2:H-4})); svg.appendChild(el('text',{class:'tk','text-anchor':'middle',x:X(v),y:ax-9},String(v)));});
  list.forEach((p,i)=>{
    const e=p.R, y=ax+i*rh+rh/2, si=S.sel.indexOf(p.c), col=si>=0?slotColor(si):'var(--k)';
    const g=el('g',{class:'bar','data-c':p.c,tabindex:0,role:'button','aria-label':p.n}); svg.appendChild(g);
    g.appendChild(el('rect',{x:0,y:y-rh/2,width:W,height:rh,fill:'transparent'}));
    g.appendChild(el('text',{class:'bt','text-anchor':'end',x:l-8,y:y+3.6,style:si>=0?'font-weight:600;fill:var(--ink)':''},esc(p.n.split('/')[0])));
    const b=el('rect',{x:X(e.rklo),y:y-4,width:Math.max(X(e.rkhi)-X(e.rklo),3),height:8,rx:4}); b.style.fill=col; b.style.fillOpacity=.42; g.appendChild(b);
    const d=el('circle',{cx:X(e.rk),cy:y,r:4.2}); d.style.fill=col; d.style.stroke='var(--ink)'; d.style.strokeWidth=1; g.appendChild(d);
    g.appendChild(el('text',{class:'bv',x:W-r+14,y:y+3.6},nf(e.rk)+' ('+nf(e.rklo)+'–'+nf(e.rkhi)+') · '+nf(e.t10*100,0)+'%'));
  });
  svg.onclick=e=>{const q=e.target.closest('[data-c]'); if(q)toggle(+q.dataset.c)};
  svg.onmouseover=e=>{const q=e.target.closest('[data-c]'); setHover(q?+q.dataset.c:null,e)};
  svg.onmousemove=e=>{if(S.hov!=null)moveTip(e)};
  svg.onmouseleave=()=>setHover(null);
}
/* ---------------- enlarge / close ---------------- */
let ZC=null, ZPH=null;
function zoomBtns(){document.querySelectorAll('.zbtn').forEach(b=>{const o=b.parentNode===ZC; b.setAttribute('aria-label',o?T().zClose:T().zOpen); b.title=o?T().zClose:T().zOpen;});}
function openZoom(card){
  if(ZC)closeZoom();
  ZC=card; ZPH=document.createElement('div'); ZPH.style.height=card.offsetHeight+'px'; if(card.classList.contains('wide'))ZPH.style.gridColumn='1/-1';
  card.parentNode.insertBefore(ZPH,card); card.classList.add('zoom'); card.setAttribute('role','dialog'); card.setAttribute('aria-modal','true');
  document.body.classList.add('zooming'); $('zbd').hidden=false; zoomBtns(); card.querySelector('.zbtn').focus();
  if(card.id==='c-ht')renderHot(); setHover(null);
}
function closeZoom(){
  if(!ZC)return; const c=ZC; ZC=null;
  c.classList.remove('zoom'); c.removeAttribute('role'); c.removeAttribute('aria-modal'); if(ZPH){ZPH.remove();ZPH=null;}
  document.body.classList.remove('zooming'); $('zbd').hidden=true; zoomBtns(); if(c.id==='c-ht')renderHot(); c.querySelector('.zbtn').focus(); setHover(null);
}
document.querySelectorAll('.zbtn').forEach(b=>b.onclick=()=>{const c=b.parentNode; if(ZC===c)closeZoom(); else openZoom(c);});
$('zbd').onclick=closeZoom;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ZC)closeZoom(); else if(S.pop!=null||S.cell!=null){S.pop=null;S.cell=null;update();}}});
document.addEventListener('focusin',e=>{if(ZC&&!ZC.contains(e.target))ZC.querySelector('.zbtn').focus();});
/* ---------------- balance the two columns ---------------- */
function balance(){
  if(ZC)return;
  const L=$('colL'), R=$('colR'), mv=[$('c-wy'),$('c-ri'),$('c-ht')];
  if(window.innerWidth<=860){mv.forEach(e=>R.appendChild(e)); renderHot(); return;}
  let best=null;
  for(let m=0;m<8;m++){
    mv.forEach((e,i)=>((m>>i)&1?L:R).appendChild(e)); renderHot();
    const d=Math.abs(L.offsetHeight-R.offsetHeight); if(!best||d<best.d-40)best={m,d};
  }
  mv.forEach((e,i)=>((best.m>>i)&1?L:R).appendChild(e)); renderHot();
}
let _bw=0; window.addEventListener('resize',()=>{if(Math.abs(window.innerWidth-_bw)>40){_bw=window.innerWidth; balance();}});

/* ---------------- comparison table ---------------- */
const flag=(lo,hi,ref)=>lo>ref?'<i class="up">▲</i>':(hi<ref?'<i class="dn">▼</i>':'');
const dash='<span style="color:var(--ink3)">—</span>';
function effCell(k,p){
  const e=p[k], t=T();
  return flag(e.lo,e.hi,1)+nf(e.rr,2)+'<small>('+nf(e.lo,2)+'–'+nf(e.hi,2)+')</small><small>'+t.rk(nf(e.rk),nf(e.rklo),nf(e.rkhi))+'</small><small>'+t.top10(pct(e.t10,0))+'</small>';
}
function zCell(p){
  const f=z=>z==null?'—':(Math.abs(z)>Z998?'<b class="z3">'+nf(z,1)+'</b>':nf(z,1));
  return f(p.z.a)+' · '+f(p.z.i)+' · '+f(p.z.u);
}
function ebCell(e){return flag(e.lo,e.hi,D.nat.share)+pct(e.eb,2)+'<small>('+pct(e.lo,2)+'–'+pct(e.hi,2)+')</small>'}
function renderTable(){
  const t=T(), n=D.nat, cols=S.sel.map(c=>byC[c]);
  const tb=$('cmp'); const R=t.row;
  const rows=[
   ['sec',t.sec.tot],
   [R.pop,p=>nf(p.pop25),nf(n.pop25)],
   [R.crashes,p=>nf(p.crashes),nf(n.crashes)],
   [R.fatal,p=>nf(p.fatal),nf(n.fatal)],
   [R.deaths,p=>nf(p.deaths),nf(n.deaths)],
   ['sec',t.sec.risk],
   [R.rate,p=>flag(p.rlo,p.rhi,n.rate)+nf(p.rate,1)+'<small>('+nf(p.rlo,1)+'–'+nf(p.rhi,1)+')</small>',nf(n.rate,1)],
   [R.ratio,p=>'×'+nf(p.rate/n.rate,2),'×1'],
   [R.rank,p=>nf(rateRank[p.c])+' / 52',dash],
   [R.cpi,p=>{const g=LAYERS.fraw.vals[p.c];return flag(g.lo,g.hi,LAYERS.fraw.ref0)+nf(g.v,2)+'<small>('+nf(g.lo,2)+'–'+nf(g.hi,2)+')</small>'},nf(LAYERS.fraw.ref0,2)],
   [R.cpiRank,p=>nf(fRank[p.c])+' / 52',dash],
   ['sec',t.sec.drv],
   [R.freq,p=>'×'+nf(Math.exp(p.cf),2),'×1'],
   [R.sev,p=>'×'+nf(Math.exp(p.cs),2),'×1'],
   [R.mult,p=>'×'+nf(Math.exp(p.cm),2),'×1'],
   [R.prod,p=>'×'+nf(Math.exp(p.ct),2),'×1'],
   ['sec',t.sec.bym],
   [R.R,p=>effCell('R',p),'1'],
   [R.F,p=>effCell('F',p),'1'],
   [R.L,p=>effCell('L',p),'1'],
   ['sec',t.sec.fat],
   [R.rawA,p=>pct(p.eb.raw,2),pct(n.share,2)],
   [R.ebA,p=>ebCell(p.eb),pct(n.share,2)],
   [R.ebI,p=>ebCell(p.ebi),dash],
   ['sec',t.sec.hs],
   [R.hot,p=>p.cells?nf(p.hot)+' / '+nf(p.cells):dash,nf(n.hot)+' / '+nf(n.cells)]
  ];
  let h='<thead><tr><th scope="col"></th><th scope="col" class="spain">'+esc(t.spain)+'</th>';
  cols.forEach((p,i)=>{h+='<th scope="col"><span class="chip"><span class="dot" style="background:'+slotColor(i)+'"></span>'+esc(p.n)+'<button type="button" class="rm" data-rm="'+p.c+'" aria-label="Remove '+esc(p.n)+'">×</button></span></th>';});
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    if(r[0]==='sec'){h+='<tr class="sect"><td colspan="'+(2+cols.length)+'">'+esc(r[1])+'</td></tr>';return;}
    h+='<tr><td>'+esc(r[0])+'</td><td class="spain">'+r[2]+'</td>'+cols.map(p=>'<td>'+r[1](p)+'</td>').join('')+'</tr>';
  });
  h+='</tbody>';
  tb.innerHTML=h;
  tb.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>toggle(+b.dataset.rm));
  $('cmpempty').textContent=S.sel.length?t.flagNote:t.cmpEmpty;
}

/* ---------------- hover & tooltip ---------------- */
const tip=$('tip');
function setHover(c,ev,anchor,src){
  S.chov=null;
  const key=c==null?null:c+'|'+(src||'');
  if(S.hov===c&&c!=null&&S.hovKey===key){ if(ev)moveTip(ev); return; }
  S.hov=c; S.hovKey=key;
  const gh=$('ghov'); gh.innerHTML='';
  document.querySelectorAll('.row.hov,.pt.hov').forEach(e=>e.classList.remove('hov'));
  if(c==null){tip.style.display='none';return;}
  gh.appendChild(el('path',{class:'ol hov',d:D.paths[c]}));
  document.querySelectorAll('.row[data-c="'+c+'"],.pt[data-c="'+c+'"]').forEach(e=>e.classList.add('hov'));
  const p=byC[c], L=LAYERS[S.layer], g=L.vals[c], t=T();
  if(src==='sc'){
    const mark=k=>{const s=LAYERS[k].sig(c); return s>0?' ▲':(s<0?' ▼':'')};
    tip.innerHTML='<b>'+esc(p.n)+'</b>'+['F','L','R'].map(k=>'<span>'+esc(t.tipSc[k])+': '+esc(ciText(k,LAYERS[k].vals[c])+mark(k))+'</span>').join('')+'<span class="tn">'+esc(t.tipScNote)+'</span><span>'+esc(t.tipLine(nf(p.deaths),nf(p.crashes)))+'</span>';
  } else
  tip.innerHTML='<b>'+esc(p.n)+'</b><span>'+esc(t.vals[S.layer])+': '+esc(ciText(S.layer,g))+'</span><span>'+esc(t.tipLine(nf(p.deaths),nf(p.crashes)))+'</span>'+(L.sig(c)?'<span>● '+esc(t.tipExcl)+'</span>':'');
  tip.style.display='block';
  if(ev)moveTip(ev); else if(anchor){const r=anchor.getBoundingClientRect(); place(r.left+r.width/2,r.top+r.height/2);}
}
function place(x,y){
  const w=tip.offsetWidth,h=tip.offsetHeight; let px=x+14, py=y+14;
  if(px+w>innerWidth-8)px=x-w-14; if(py+h>innerHeight-8)py=y-h-14;
  tip.style.left=Math.max(8,px)+'px'; tip.style.top=Math.max(8,py)+'px';
}
function moveTip(e){place(e.clientX,e.clientY)}

/* ---------------- selection ---------------- */
function toggle(c){
  const i=S.sel.indexOf(c);
  if(i>=0)S.sel.splice(i,1); else {S.sel.push(c); if(S.sel.length>3)S.sel.shift();}
  update();
}
function fillAdd(){
  const s=$('add'); s.innerHTML='<option value="">'+esc(T().addPh)+'</option>';
  [...P].sort((a,b)=>a.n.localeCompare(b.n,lang)).forEach(p=>{const o=document.createElement('option');o.value=p.c;o.textContent=p.n;s.appendChild(o);});
}
$('add').onchange=e=>{const v=+e.target.value; if(v&&S.sel.indexOf(v)<0){S.sel.push(v);if(S.sel.length>3)S.sel.shift();} e.target.value=''; update();};
$('clear').onclick=()=>{S.sel=[];update();};
$('v-prov').onclick=()=>{S.view='prov';S.pop=null;update();};
$('v-cell').onclick=()=>{S.view='cell';S.pop=null;update();};
$('cprov').onchange=()=>{S.cprov=+$('cprov').value; update();};
$('celltop').onclick=e=>{const tr=e.target.closest('tr[data-i]'); if(tr)selectCell(+tr.dataset.i)};
$('celltop').onmouseover=e=>{const tr=e.target.closest('tr[data-i]'); setCellHover(tr?+tr.dataset.i:null,e)};
$('celltop').onmousemove=e=>{if(S.chov!=null)moveTip(e)};
$('celltop').onmouseleave=()=>setCellHover(null);
$('sortdir').onclick=()=>{S.asc=!S.asc;update();};
$('more').onclick=()=>{S.topn=S.topn>30?30:100;update();};
$('hot').onchange=e=>{S.hot=e.target.checked;update();};

/* ---------------- language & hash ---------------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>{const k=e.dataset.i; if(k!=='how'){const v=T()[k]; if(typeof v==='string')e.textContent=v;}});
  $('how').innerHTML=T().how.map(s=>'<li>'+esc(s)+'</li>').join('');
  $('l-en').setAttribute('aria-pressed',String(lang==='en')); $('l-es').setAttribute('aria-pressed',String(lang==='es'));
  fillAdd(); zoomBtns();
}
$('l-en').onclick=()=>{lang='en';applyLang();update();balance();};
$('l-es').onclick=()=>{lang='es';applyLang();update();balance();};
function writeHash(){
  try{history.replaceState(null,'','#'+[S.view==='cell'?S.cl:S.layer].concat(S.sel).concat(S.cell!=null?['c'+S.cell]:[]).concat(S.asc?['asc']:[]).concat(S.topn>30?['n100']:[]).join('-'));}catch(e){}
}
function readHash(){
  const h=(location.hash||'').slice(1); if(!h)return false;
  const parts=h.split('-'), k=parts[0];
  if(LAYERS[k]){S.view='prov';S.layer=k;} else if(CLAY[k]){S.view='cell';S.cl=k;} else return false;
  S.sel=[]; S.cell=null; S.asc=false; S.topn=30;
  parts.slice(1).forEach(x=>{
    if(x==='asc')S.asc=true; else if(x==='n100')S.topn=100;
    else if(/^c\d+$/.test(x)){const i=+x.slice(1); if(CELL[i])S.cell=i;}
    else{const c=+x; if(byC[c]&&S.sel.length<3&&S.sel.indexOf(c)<0)S.sel.push(c);}
  });
  return true;
}

function update(){
  loadColors(); renderViewSeg(); renderLayers(); renderLegend(); renderMap(); renderRankPanel(); renderScatter(); renderFunnel(); renderWhy(); renderRI(); renderHot(); renderTable(); renderCellInfo(); renderPop(); writeHash();
  setHover(null);
}
function init(){
  loadColors();
  if(!readHash())S.sel=[42,24,52];
  applyLang(); update(); _bw=window.innerWidth; balance();
  try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',update);}catch(e){}
  new MutationObserver(update).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}
if(document.fonts&&document.fonts.ready){init();document.fonts.ready.then(()=>{});}else init();
</script>
